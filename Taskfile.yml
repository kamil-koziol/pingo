# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  "sqlc:generate":
    desc: Generate SQL code
    cmds:
      - go tool sqlc generate

  "sqlc:check":
    desc: Check sqlc generated queries
    cmds:
      - go tool sqlc diff

  "buf:generate":
    desc: Generate protobuf code
    cmds:
      - go tool buf generate

  "buf:check:generate":
    desc: Check generated protobuf code is up to date
    cmds:
      - go tool buf generate
      - git diff --exit-code -- '*.pb.go'

  "buf:lint":
    desc: Lint proto
    cmds:
      - go tool buf lint

  "buf:fmt":
    desc: Format protobuf files
    cmds:
      - go tool buf format -w

  "buf:check:fmt":
    desc: Check protobuf formatting
    cmds:
      - go tool buf format --diff --exit-code

  "buf:check":
    desc: Lint, format, and check generated protobuf code
    deps: ["buf:lint", "buf:check:fmt", "buf:check:generate"]

  generate:
    desc: Generate all code
    deps: ["sqlc:generate", "buf:generate"]

  fmt:
    desc: Format Go code
    cmds:
      - go tool gofumpt -w .

  "fmt:check":
    desc: Check Go formatting
    cmds:
      - test -z "$(go tool gofumpt -l .)"

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  staticcheck:
    desc: Run staticcheck
    cmds:
      - go tool staticcheck ./...

  errcheck:
    desc: Check for unchecked errors
    cmds:
      - go tool errcheck -ignoregenerated ./...

  ineffassign:
    desc: Check for ineffectual assignments
    cmds:
      - go tool ineffassign ./...

  lint:
    desc: Run all linters
    deps: [vet, staticcheck, errcheck, ineffassign]

  check:
    desc: Check formatting and run all linters
    deps: ["fmt:check", "sqlc:check", "buf:check", lint]
